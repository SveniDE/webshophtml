<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farben und Schrift</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            color:chocolate;
        }
        h1{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .name{
            color: green;
        }
        .hex {
            color: #123584;
        }
        .rgb{
            color: rgb(123, 34, 87);
        }
        .hintergrund {
            background-color: #111111;
            color: white;
        }
        .gross {
            font-size: 28px;
        }
        .klein {
            font-size: 10px;
        }
        .fett { 
            font-weight: bold;
        }
        .kursiv{
            font-style: italic;
        }
        .mitte{
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>Farbe und Schrift</h1>
    <h2>Farben</h2>
    <p class="name">Farbe als Name : Green</p>
    <p class="hex">Farbe als Hex-Wert...</p>
    <p class="rgb">Farbe als RGB</p>
    <p class="hintergrund">Weiße Schrift auf dunklem Hintergrund</p>

    <h2>Schrift</h2>
    <p class="gross">Große Schrift</p>
    <p class="klein">kleine Schrift</p>
    <p class="fett">Fette Schrift</p>
    <p class="kursiv">Kursive Schrift</p>
    <p class="mitte"> Mittige Schrift</p>
    
    <h2 class="mitte","kursiv" >versuch</h2>
</body>
</html>
